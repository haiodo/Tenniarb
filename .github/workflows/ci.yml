name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web packages (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Typecheck and test
        run: make web-test

      - name: Build
        run: make web

  test:
    name: Vet and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Vet and test
        run: cd go && go vet ./... && go test ./...

  # GUI tests start the app and drive it through gowt's QA server, as gowt runs its own GUI gates
  # (Xvfb + openbox).
  gui-linux:
    name: GUI tests (Linux, Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install GTK, Xvfb and a window manager
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0 xvfb openbox xauth

      - name: GUI tests
        run: cd go && GOWT_GUI_TEST=1 xvfb-run -a -s '-screen 0 1600x1000x24' sh -c 'openbox & sleep 1; go test ./app/...'

  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            targets: go-pkg-mac
          - name: Windows and Linux
            os: ubuntu-latest
            targets: go-pkg-win go-pkg-linux
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe for the version

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Package
        run: make ${{ matrix.targets }}

      # Unsigned, not notarized: Gatekeeper and SmartScreen will warn on a downloaded copy.
      - uses: actions/upload-artifact@v7
        with:
          name: tenniarb-go-${{ matrix.os }}
          path: |
            build/go/*.zip
            build/go/*.dmg
            build/go/*.tar.gz
          if-no-files-found: error
