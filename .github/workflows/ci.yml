name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (macOS / Xcode)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      # No setup-swift here on purpose: xcodebuild and swift-format both come from the
      # Xcode toolchain, and a toolchain on PATH shadows them with a different version.
      - name: Show environment info
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun swift-format --version

      - name: SwiftLint
        run: |
          set -euo pipefail
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "SwiftLint is not installed, installing via Homebrew..."
            brew install swiftlint
          fi
          swiftlint version
          swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

      - name: Format check
        run: make format-check

      - name: Build (Debug)
        run: |
          set -euo pipefail
          make build | tee xcodebuild.log

      - name: Run tests
        run: |
          set -euo pipefail
          make test | tee xcodebuild-test.log

      - name: Upload build & test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild.log
            xcodebuild-test.log
