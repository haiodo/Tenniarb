name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (macOS / Xcode)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      # No setup-swift here on purpose: xcodebuild and swift-format both come from the
      # Xcode toolchain, and a toolchain on PATH shadows them with a different version.
      - name: Show environment info
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun swift-format --version

      - name: SwiftLint
        run: |
          set -euo pipefail
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "SwiftLint is not installed, installing via Homebrew..."
            brew install swiftlint
          fi
          swiftlint version
          swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

      - name: Format check
        run: make format-check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build (Debug)
        run: |
          set -euo pipefail
          make build | tee xcodebuild.log

      - name: Run tests
        run: |
          set -euo pipefail
          make test | tee xcodebuild-test.log

      - name: Upload build & test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild.log
            xcodebuild-test.log

  web:
    name: Web packages (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Typecheck and test
        run: make web-test

      - name: Build
        run: make web


  app:
    name: Tauri app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, bin: tenniarb }
          - { name: Windows, os: windows-latest, bin: tenniarb.exe }
          - { name: Linux, os: ubuntu-22.04, bin: tenniarb }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/packages/app/src-tauri

      - name: Install npm packages
        run: npm ci
        working-directory: web

      - name: Build (debug, no bundle)
        run: npx tauri build --debug --no-bundle
        working-directory: web/packages/app

      - name: Binary exists
        shell: bash
        run: ls -l web/packages/app/src-tauri/target/debug/${{ matrix.bin }}

      # timeout exit 124 = still running after 8 s.
      - name: Smoke launch (Linux, xvfb)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          code=0
          timeout 8 xvfb-run -a web/packages/app/src-tauri/target/debug/tenniarb || code=$?
          test "$code" = 124
