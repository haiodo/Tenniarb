name: Go

on:
  push:
    branches: [main, master]
    paths: ['go/**', 'web/packages/**', 'Tenniarb/TennIco.icns', 'Tenniarb/Assets.xcassets/**', 'Makefile', '.github/workflows/go.yml']
  pull_request:
    branches: [main, master]
    paths: ['go/**', 'web/packages/**', 'Tenniarb/TennIco.icns', 'Tenniarb/Assets.xcassets/**', 'Makefile', '.github/workflows/go.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Vet and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.os == 'windows-latest' }} # not run on Windows yet, see go-port plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Vet and test
        run: cd go && go vet ./... && go test ./...

  # GUI tests start the app and drive it through gowt's QA server. gowt runs its own GUI gates this way
  # (Xvfb + openbox); the Tenniarb app tests have not been run on Linux yet, so failures do not block.
  gui-linux:
    name: GUI tests (Linux, Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install GTK, Xvfb and a window manager
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0 xvfb openbox xauth

      - name: GUI tests
        run: cd go && GOWT_GUI_TEST=1 xvfb-run -a -s '-screen 0 1600x1000x24' sh -c 'openbox & sleep 1; go test ./app/...'

  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            targets: go-pkg-mac
          - name: Windows and Linux
            os: ubuntu-latest
            targets: go-pkg-win go-pkg-linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the version

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Package
        run: make ${{ matrix.targets }}

      # Unsigned, not notarized: Gatekeeper and SmartScreen will warn on a downloaded copy.
      - uses: actions/upload-artifact@v4
        with:
          name: tenniarb-go-${{ matrix.os }}
          path: |
            build/go/*.zip
            build/go/*.dmg
            build/go/*.tar.gz
          if-no-files-found: error
