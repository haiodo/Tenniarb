name: Release

# The Swift app is no longer shipped: 2.0 is the Go application. The Xcode project stays in the tree
# (the Swift tests still run in CI), but nothing here builds it.

on:
  push:
    tags:
      - '*'          # trigger on any tag push
  workflow_dispatch:  # allow manual runs

permissions:
  contents: write    # needed to create the release and upload assets

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Vet and test
        run: cd go && go vet ./... && go test ./...

  mac:
    name: Package macOS (universal)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe and the commit count for the build number
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Version from the tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}([.-][A-Za-z0-9]+)?$ ]]; then
            echo "::error::Version \"$VERSION\" doesn't look like 2.0 or 2.0.1"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build the app and the disk image
        run: make go-pkg-mac-universal GO_SHORT=${{ steps.version.outputs.version }} GO_VERSION=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            build/go/*.dmg
            build/go/*.app.zip
          if-no-files-found: error

  windows-linux:
    name: Package Windows and Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Version from the tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build the packages
        run: make go-pkg-win go-pkg-linux GO_SHORT=${{ steps.version.outputs.version }} GO_VERSION=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux
          path: |
            build/go/*.zip
            build/go/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [mac, windows-linux]
    steps:
      - uses: actions/checkout@v4
      - name: Version and notes
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The section of docs/Changelog.md for this version, if it is there.
          NOTES=/tmp/notes.md
          awk -v v="$VERSION" '
            $0 ~ "^## Version " v "([^0-9.]|$)" {on=1; next}
            on && /^## Version / {exit}
            on {print}
          ' docs/Changelog.md > "$NOTES" || true
          if [ ! -s "$NOTES" ]; then
            printf 'Tenniarb %s.\n\nAssets are unsigned: macOS asks you to allow the app in Security, Windows shows a SmartScreen warning.\n' "$VERSION" > "$NOTES"
          fi
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Tenniarb $VERSION" --notes-file "$NOTES" --draft
          gh release upload "$TAG" dist/* --clobber
