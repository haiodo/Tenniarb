<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenniarb editor demo</title>
<style>
  body { font: 13px -apple-system, system-ui, sans-serif; margin: 0; color-scheme: light dark; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header { padding: 6px 12px; border-bottom: 1px solid #ccc; display: flex; gap: 12px; align-items: center; }
  #app { min-height: 0; }
</style>
<!-- Build first (npm run build -w @tenniarb/editor), serve dist/ over http (node scripts/smoke.ts does). -->
</head>
<body>
<header>
  <button id="undo">Undo</button><button id="redo">Redo</button>
  <label><input type="checkbox" id="ro"> readonly</label>
  <span id="status">loading</span>
</header>
<main id="app"></main>
<script type="module">
  import { mount, mountLayout } from "./editor.js";
  const text = await (await fetch("Example.tenn")).text();
  const status = document.getElementById("status");
  const layout = mountLayout(document.getElementById("app"));
  layout.setTitle("Example");
  window.changes = 0;
  async function start(readonly) {
    window.editor = await mount(layout.editor, {
      text,
      element: "Documentation/Basic steps",
      properties: layout.props,
      outline: layout.outline,
      toolbar: layout.bar,
      readonly,
      fontBaseUrl: "fonts/",
      embedBundleUrl: "tenniarb-embed.min.js",
      onChange: (t) => { window.changes++; window.lastText = t; status.textContent = `changes: ${window.changes}`; },
    });
    status.textContent = readonly ? "readonly" : "ready";
  }
  document.getElementById("undo").onclick = () => window.editor.undo();
  document.getElementById("redo").onclick = () => window.editor.redo();
  document.getElementById("ro").onchange = (e) => start(e.target.checked);
  await start(false);
</script>
</body>
</html>
